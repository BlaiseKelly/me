project:
  type: website
  resources:
    - CNAME

website:
  title: "Blaise Kelly"
  site-url: https://blaisekelly.github.io/me/
  description: "Geospatial data science for transport, air quality, and road safety."
  favicon: media/BK.png
  page-navigation: true
  back-to-top-navigation: true
  google-analytics:
    tracking-id: "G-EYS2B9FC38"
    anonymize-ip: true
    storage: cookies      # or: none  (see note below)
  cookie-consent:
    type: express         # opt-in; use "implied" for a softer banner
    style: simple

  navbar:
    logo: media/BK.png
    tools:
      - icon: github
        href: https://github.com/blaiser
    right:
      - text: About
        href: about.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Contact
        href: contact.qmd

  page-footer:
    left: >-
      &#169; 2026 Blaise Kelly &#8729; Made with [Quarto](https://quarto.org)
    center: |
      <a class="link-dark me-1" href="https://github.com/blaisekelly" title="GitHub" target="_blank" rel="noopener">{{< fa brands github >}}</a>
      <a class="link-dark me-1" href="https://linkedin.com/blaiser" title="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>
      <a class="link-dark me-1" href="contact.html" title="Email">{{< fa envelope >}}</a>
    right:
      - icon: rss
        href: blog/index.xml

format:
  html:
    theme:
      light:
        - cosmo
        - assets/aa-theme-light.scss
        - assets/aa/colors-light.scss
        - assets/aa/fonts.scss
      dark:
        - cosmo
        - assets/aa-theme-dark.scss
        - assets/aa/colors-dark.scss
        - assets/aa/fonts.scss
    highlight-style: a11y   # built-in; replaces the missing a11y-*.theme files
    code-link: true
    pagetitle: "{{< meta title >}}"
    lightbox: true

execute:
  freeze: auto
